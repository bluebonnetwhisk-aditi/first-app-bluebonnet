<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bluebonnet Whisk</title>
    <script>
      // Single Page App redirect for static hosts (GitHub Pages, etc.)
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path.startsWith('/') ? path.substring(1) : path) + search + hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">Bluebonnet Whisk</a>...</p>
  </body>
</html>
